[project]
name = "techdoc-assistant"
version = "1.0.0"
description = "Asistente RAG para documentación técnica con FastAPI y LangChain"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.4",
  "langchain-core>=0.3",
  "langchain-text-splitters>=0.3",
  "langchain-openai>=0.2",
  "langchain-ollama>=0.2",
  "langchain-chroma>=0.1.4",
  "langchain-huggingface>=0.1",
  "sentence-transformers>=3.0",
  "pypdf>=5.0",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # patrón estándar de FastAPI: Depends() en defaults

